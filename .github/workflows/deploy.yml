name: Deploy Cyberpunk Tetris to GitHub Pages

# main 브랜치에 코드가 push될 때 자동으로 배포 실행
on:
  push:
    branches: ["main"]

  # Actions 탭에서 수동으로 실행 가능하도록 동기화
  workflow_dispatch:

# GitHub Pages 배포 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 설정
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 정적 웹사이트 빌드 및 배포 작업
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 루트 디렉토리 정적 파일 업로드
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
